# Simple AF's grumpyscreen macros: the [macro] tiles Simple AF's installer
# writes into grumpyscreen's macros.cfg (CONFIG_VENDOR_FILE) for the probe a
# printer has (pellcorp/creality k1/installer.sh, add_grumpyscreen_probe_macros,
# at 7ad343d). The app cannot know a printer's probe, so it ships all of them;
# the Macros tab greys out any whose command the connected printer lacks.
#
# Your own [macro "..."] sections go in grumpyscreen-override.cfg.

# bltouch, microprobe, klicky
[macro "PROBE_CALIBRATE"]
display_name: Probe Calibrate
icon: home_z

# cartographer
[macro "CARTOGRAPHER_SCAN_CALIBRATE"]
display_name: Cartographer Calibrate
icon: home_z

# cartotouch
[macro "CARTOGRAPHER_CALIBRATE METHOD=manual"]
display_name: Cartographer Calibrate
icon: home_z

# beacon, eddyng, btteddy
[macro "_SET_KIN_MAX_Z"]
display_name: Fake Home
icon: emergency

# beacon
[macro "_CALIBRATE_HEAT_SOAK"]
display_name: Heat Soak
icon: bed

[macro "BEACON_CALIBRATE"]
display_name: Beacon Calibrate
icon: home_z

# eddyng
[macro "PROBE_EDDY_NG_SETUP"]
display_name: Eddy NG Setup
icon: home_z

# btteddy
[macro "BTTEDDY_CALIBRATE_DRIVE_CURRENT"]
display_name: BTT Calibrate Drive
icon: home_z

[macro "BTTEDDY_CURRENT_CALIBRATE"]
display_name: BTT Eddy Calibrate
icon: home_z

# load cells
[macro "_GRUMPY_LOAD_CELL_CALIBRATE"]
display_name: Load Cell Calibrate
icon: home_z

[macro "LOAD_CELL_DIAGNOSTIC"]
display_name: Load Cell Diagnostic
icon: info

[macro "LOAD_CELL_TEST_TAP"]
display_name: Load Cell Test Tap
icon: home_z
